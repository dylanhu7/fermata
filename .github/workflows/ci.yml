name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    # GitHub's image with Xcode 27 on macOS 27.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_27.2.app

      - name: Test
        run: swift test --package-path Packages/FermataCore

      # Releases are signed and notarized with ./build.sh release, not here.
      - name: Build
        run: xcodebuild -scheme Fermata -configuration Release -arch arm64 -derivedDataPath .build CODE_SIGNING_ALLOWED=NO build
